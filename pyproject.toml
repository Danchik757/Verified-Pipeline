[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verified-pipeline"
version = "0.1.0"
description = "Evidence-gated mesh stimulus and saliency experiment orchestration"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
geometry = ["numpy>=1.24,<3"]

[project.scripts]
verified-pipeline = "verified_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
envelope_height_calibration = ["release_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
